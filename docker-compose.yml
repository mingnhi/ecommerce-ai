version: '3.9'

services:
  # ─── Database ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - ecommerce_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - ecommerce_network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis123}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/ecommerce_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ─── Admin Dashboard ─────────────────────────────────────────
  admin:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: ecommerce_admin
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ─── AI Recommendation Service ────────────────────────────────
  recommendation:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: ecommerce_recommendation
    environment:
      MODEL_PATH: /app/models/ncf_model.pth
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/ecommerce_db
    volumes:
      - model_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ─── Model Trainer (chạy theo lịch, không luôn bật) ──────────
  trainer:
    build:
      context: ./trainer
      dockerfile: Dockerfile
    container_name: ecommerce_trainer
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/ecommerce_db
      MODEL_OUTPUT_PATH: /models/ncf_model.pth
      EPOCHS: '20'
      BATCH_SIZE: '256'
    volumes:
      - model_data:/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network
    profiles:
      - training  # chạy bằng: docker compose --profile training up trainer

  # ─── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - admin
      - recommendation
    networks:
      - ecommerce_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  model_data:

networks:
  ecommerce_network:
    driver: bridge
